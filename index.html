<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vibely</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://uzggwbtibysgxyplyvoq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SSfmEuuSHJp0CNDnyVdFEg_qqXb2hat";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: white;
      padding: 16px;
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .feed {
      max-width: 500px;
      margin: auto;
      padding-bottom: 90px;
    }

    .post {
      background: white;
      margin: 15px 10px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 8px #ddd;
    }

    .user {
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
    }

    .video {
      height: 420px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 60px;
    }

    .actions {
      padding: 14px;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .action-btn {
      border: none;
      background: none;
      font-size: 28px;
      cursor: pointer;
    }

    .like-btn.liked {
      color: red;
    }

    .like-count {
      font-size: 15px;
      margin-left: -10px;
    }

    .caption {
      padding: 0 14px 15px;
      font-size: 17px;
    }

    .comments {
      padding: 0 14px 15px;
      display: none;
    }

    .comments input {
      width: 75%;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .comments button {
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
    }

    .comment-list {
      margin-top: 10px;
    }

    .comment {
      background: #f1f1f1;
      padding: 8px;
      border-radius: 8px;
      margin-top: 5px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 28px;
      z-index: 20;
    }
  </style>
</head>

<body>

  <header>Vibely ✨</header>

  <main class="feed">

    <!-- POST 1 -->
    <div class="post" data-post-id="1">

      <div class="user">👤 Vibely User</div>

      <div class="video">▶️</div>

      <div class="actions">

        <button class="action-btn like-btn"
                onclick="likePost(this)">
          ❤️
        </button>

        <span class="like-count">0 likes</span>

        <button class="action-btn"
                onclick="toggleComments(this)">
          💬
        </button>

        <button class="action-btn"
                onclick="sharePost(this)">
          ↗️
        </button>

      </div>

      <div class="caption">
        Welcome to Vibely! 🎬✨
      </div>

      <div class="comments">

        <div>
          <input type="text" placeholder="Write a comment...">
          <button onclick="addComment(this)">Post</button>
        </div>

        <div class="comment-list"></div>

      </div>

    </div>


    <!-- POST 2 -->
    <div class="post" data-post-id="2">

      <div class="user">👤 Creator</div>

      <div class="video">🎥</div>

      <div class="actions">

        <button class="action-btn like-btn"
                onclick="likePost(this)">
          ❤️
        </button>

        <span class="like-count">0 likes</span>

        <button class="action-btn"
                onclick="toggleComments(this)">
          💬
        </button>

        <button class="action-btn"
                onclick="sharePost(this)">
          ↗️
        </button>

      </div>

      <div class="caption">
        Share your vibe with the world! 🌎
      </div>

      <div class="comments">

        <div>
          <input type="text" placeholder="Write a comment...">
          <button onclick="addComment(this)">Post</button>
        </div>

        <div class="comment-list"></div>

      </div>

    </div>

  </main>


  <div class="bottom-nav">
    <span>🏠</span>
    <span>🔍</span>
    <span>➕</span>
    <span>❤️</span>
    <span>👤</span>
  </div>


  <script>

    // LOAD CURRENT LIKES
    async function loadLikes() {

      const { data, error } = await supabaseClient
        .from("posts")
        .select("id, likes");

      if (error) {
        console.error("Load likes error:", error);
        return;
      }

      data.forEach(postData => {

        const post = document.querySelector(
          `.post[data-post-id="${postData.id}"]`
        );

        if (!post) return;

        const count = post.querySelector(".like-count");

        count.textContent =
          (postData.likes || 0) + " likes";

      });
    }


    // LIKE / UNLIKE
    async function likePost(button) {

      const post = button.closest(".post");

      const postId = Number(
        post.dataset.postId
      );

      const count = post.querySelector(".like-count");

      // Get current database value
      const { data, error } = await supabaseClient
        .from("posts")
        .select("likes")
        .eq("id", postId)
        .single();

      if (error) {
        console.error("Read like error:", error);
        alert("Like save nahi ho raha. Console error check karo.");
        return;
      }

      const currentlyLiked =
        button.classList.contains("liked");

      let newLikes;

      if (currentlyLiked) {
        newLikes = Math.max(
          (data.likes || 0) - 1,
          0
        );
      } else {
        newLikes = (data.likes || 0) + 1;
      }


      // Update Supabase
      const { error: updateError } =
        await supabaseClient
          .from("posts")
          .update({
            likes: newLikes
          })
          .eq("id", postId);

      if (updateError) {
        console.error(
          "Update like error:",
          updateError
        );

        alert("Like database mein save nahi hua.");
        return;
      }


      // Update screen ONLY after database success
      button.classList.toggle("liked");

      count.textContent =
        newLikes + " likes";

    }


    // COMMENTS OPEN / CLOSE
    function toggleComments(button) {

      const comments =
        button.closest(".post")
          .querySelector(".comments");

      if (comments.style.display === "block") {
        comments.style.display = "none";
      } else {
        comments.style.display = "block";
      }

    }


    // ADD COMMENT 
    async function addComment(button) {

  const comments = button.closest(".comments");

  const input = comments.querySelector("input");
  const text = input.value.trim();

  if (!text) return;

  const post = button.closest(".post");
  const postId = Number(post.dataset.postId);

  const { error } = await supabaseClient
    .from("comments")
    .insert({
      post_id: postId,
      username: "Vibely User",
      comment: text
    });

  if (error) {
    console.error("Comment error:", error);
    alert("Comment save nahi hua.");
    return;
  }

  input.value = "";

  await loadComments(postId);
        }
    async function loadComments(postId) {

  const post = document.querySelector(
    `.post[data-post-id="${postId}"]`
  );

  const list = post.querySelector(".comment-list");

  const { data, error } = await supabaseClient
    .from("comments")
    .select("username, comment")
    .eq("post_id", postId)
    .order("created_at", { ascending: true });

  if (error) {
    console.error("Load comments error:", error);
    return;
  }

  list.innerHTML = "";

  data.forEach(item => {

    const div = document.createElement("div");

    div.className = "comment";

    div.textContent =
      "💬 " + item.username + ": " + item.comment;

    list.appendChild(div);
  });
      }
    }


    // SHARE
    async function sharePost(button) {

      const post =
        button.closest(".post");

      const caption =
        post.querySelector(".caption")
          .textContent.trim();

      if (navigator.share) {

        try {

          await navigator.share({
            title: "Vibely",
            text: caption,
            url: window.location.href
          });

        } catch (error) {
          console.log("Share cancelled");
        }

      } else {

        alert("Share option is not supported on this browser.");

      }

    }


    // LOAD LIKES WHEN PAGE OPENS
    loadLikes();

  </script>

</body>
      </html>
