<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vibely</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://uzggwbtibysgxyplyvoq.supabase.co";

    // Apni existing sb_publishable_... key yahan rakho
    const SUPABASE_KEY = "sb_publishable_SSfmEuuSHJp0CNDnyVdFEg_qqXb2hat";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  </script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: white;
      padding: 16px;
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .upload-box {
      max-width: 500px;
      margin: 15px auto;
      padding: 15px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 2px 8px #ddd;
    }

    .upload-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .upload-box input[type="file"] {
      width: 100%;
      margin-bottom: 10px;
    }

    .caption-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .upload-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .upload-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .upload-status {
      margin-top: 10px;
      font-size: 14px;
      text-align: center;
    }

    .feed {
      max-width: 500px;
      margin: auto;
      padding-bottom: 90px;
    }

    .post {
      background: white;
      margin: 15px 10px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 8px #ddd;
    }

    .user {
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
    }

    .video {
      height: 420px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 60px;
      overflow: hidden;
    }

    .video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .actions {
      padding: 14px;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .action-btn {
      border: none;
      background: none;
      font-size: 28px;
      cursor: pointer;
    }

    .like-btn.liked {
      color: red;
    }

    .like-count {
      font-size: 15px;
      margin-left: -10px;
    }

    .caption {
      padding: 0 14px 15px;
      font-size: 17px;
    }

    .comments {
      padding: 0 14px 15px;
      display: none;
    }

    .comments input {
      width: 75%;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .comments button {
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
    }

    .comment-list {
      margin-top: 10px;
    }

    .comment {
      background: #f1f1f1;
      padding: 8px;
      border-radius: 8px;
      margin-top: 5px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 28px;
      z-index: 20;
    }

  </style>

</head>

<body>

  <header>Vibely ✨</header>


  <!-- UPLOAD VIDEO -->

  <div class="upload-box">

    <div class="upload-title">
      🎥 Upload your vibe
    </div>

    <input
      type="file"
      id="videoInput"
      accept="video/*"
    >

    <input
      type="text"
      id="captionInput"
      class="caption-input"
      placeholder="Write a caption..."
    >

    <button
      class="upload-btn"
      id="uploadBtn"
      onclick="uploadVideo()"
    >
      📤 Upload Video
    </button>

    <div
      id="uploadStatus"
      class="upload-status"
    ></div>

  </div>


  <main class="feed">


    <!-- POST 1 -->

    <div
      class="post"
      data-post-id="1"
    >

      <div class="user">
        👤 Vibely User
      </div>

      <div class="video">
  <video
    controls
    playsinline
    style="width:100%; height:100%; object-fit:cover;">
    <source src="https://uzggwbtibysgxyplyvoq.supabase.co/storage/v1/object/public/Videos/1788758343787-1000044512.mp4" type="video/mp4">
  </video>
      </div>

      <div class="actions">

        <button
          class="action-btn like-btn"
          onclick="likePost(this)"
        >
          ❤️
        </button>

        <span class="like-count">
          0 likes
        </span>

        <button
          class="action-btn"
          onclick="toggleComments(this)"
        >
          💬
        </button>

        <button
          class="action-btn"
          onclick="sharePost(this)"
        >
          ↗️
        </button>

      </div>

      <div class="caption">
        Welcome to Vibely! 🎬✨
      </div>

      <div class="comments">

        <div>

          <input
            type="text"
            placeholder="Write a comment..."
          >

          <button onclick="addComment(this)">
            Post
          </button>

        </div>

        <div class="comment-list"></div>

      </div>

    </div>


    <!-- POST 2 -->

    <div
      class="post"
      data-post-id="2"
    >

      <div class="user">
        👤 Creator
      </div>

      <div class="video">
        🎥
      </div>

      <div class="actions">

        <button
          class="action-btn like-btn"
          onclick="likePost(this)"
        >
          ❤️
        </button>

        <span class="like-count">
          0 likes
        </span>

        <button
          class="action-btn"
          onclick="toggleComments(this)"
        >
          💬
        </button>

        <button
          class="action-btn"
          onclick="sharePost(this)"
        >
          ↗️
        </button>

      </div>

      <div class="caption">
        Share your vibe with the world! 🌎
      </div>

      <div class="comments">

        <div>

          <input
            type="text"
            placeholder="Write a comment..."
          >

          <button onclick="addComment(this)">
            Post
          </button>

        </div>

        <div class="comment-list"></div>

      </div>

    </div>


  </main>


  <div class="bottom-nav">

    <span>🏠</span>
    <span>🔍</span>
    <span>➕</span>
    <span>❤️</span>
    <span>👤</span>

  </div>


  <script>


    // =========================
    // LOAD CURRENT LIKES
    // =========================

    async function loadLikes() {

      const { data, error } =
        await supabaseClient
          .from("posts")
          .select("id, likes");

      if (error) {

        console.error(
          "Load likes error:",
          error
        );

        return;
      }

      data.forEach(postData => {

        const post =
          document.querySelector(
            `.post[data-post-id="${postData.id}"]`
          );

        if (!post) return;

        const count =
          post.querySelector(".like-count");

        count.textContent =
          (postData.likes || 0) + " likes";

      });

    }


    // =========================
    // LIKE / UNLIKE
    // =========================

    async function likePost(button) {

      const post =
        button.closest(".post");

      const postId =
        Number(post.dataset.postId);

      const count =
        post.querySelector(".like-count");


      const { data, error } =
        await supabaseClient
          .from("posts")
          .select("likes")
          .eq("id", postId)
          .single();


      if (error) {

        console.error(
          "Read like error:",
          error
        );

        alert(
          "Like save nahi ho raha."
        );

        return;
      }


      const currentlyLiked =
        button.classList.contains("liked");


      let newLikes;


      if (currentlyLiked) {

        newLikes =
          Math.max(
            (data.likes || 0) - 1,
            0
          );

      } else {

        newLikes =
          (data.likes || 0) + 1;

      }


      const { error: updateError } =
        await supabaseClient
          .from("posts")
          .update({
            likes: newLikes
          })
          .eq("id", postId);


      if (updateError) {

        console.error(
          "Update like error:",
          updateError
        );

        alert(
          "Like database mein save nahi hua."
        );

        return;
      }


      button.classList.toggle("liked");

      count.textContent =
        newLikes + " likes";

    }


    // =========================
    // COMMENTS OPEN / CLOSE
    // =========================

    function toggleComments(button) {

      const comments =
        button.closest(".post")
          .querySelector(".comments");


      if (
        comments.style.display === "block"
      ) {

        comments.style.display =
          "none";

      } else {

        comments.style.display =
          "block";

      }

    }


    // =========================
    // ADD COMMENT
    // =========================

    async function addComment(button) {

      const comments =
        button.closest(".comments");

      const input =
        comments.querySelector("input");

      const text =
        input.value.trim();


      if (!text) return;


      const post =
        button.closest(".post");

      const postId =
        Number(post.dataset.postId);


      const { error } =
        await supabaseClient
          .from("comments")
          .insert({

            post_id: postId,

            username: "Vibely User",

            comment: text

          });


      if (error) {

        console.error(
          "Comment error:",
          error
        );

        alert(
          "Comment save nahi hua."
        );

        return;
      }


      input.value = "";

      await loadComments(postId);

    }


    // =========================
    // LOAD COMMENTS
    // =========================

    async function loadComments(postId) {

      const post =
        document.querySelector(
          `.post[data-post-id="${postId}"]`
        );


      if (!post) return;


      const list =
        post.querySelector(".comment-list");


      if (!list) return;


      const { data, error } =
        await supabaseClient
          .from("comments")
          .select(
            "username, comment"
          )
          .eq(
            "post_id",
            postId
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "Load comments error:",
          error
        );

        return;
      }


      list.innerHTML = "";


      data.forEach(item => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "comment";


        div.textContent =
          "💬 " +
          item.username +
          ": " +
          item.comment;


        list.appendChild(div);

      });

    }


    // =========================
    // UPLOAD VIDEO
    // =========================

    async function uploadVideo() {

      const videoInput =
        document.getElementById(
          "videoInput"
        );

      const captionInput =
        document.getElementById(
          "captionInput"
        );

      const uploadBtn =
        document.getElementById(
          "uploadBtn"
        );

      const status =
        document.getElementById(
          "uploadStatus"
        );


      const file =
        videoInput.files[0];


      const caption =
        captionInput.value.trim();


      if (!file) {

        alert(
          "Pehle video select karo."
        );

        return;
      }


      if (
        !file.type.startsWith("video/")
      ) {

        alert(
          "Sirf video file select karo."
        );

        return;
      }


      uploadBtn.disabled = true;

      status.textContent =
        "⏳ Video upload ho raha hai...";


      try {

        /*
          Unique file name
          example:
          172345678-video.mp4
        */

        const fileName =
          Date.now() +
          "-" +
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        // Upload to Supabase Storage

        const { error: uploadError } =
          await supabaseClient
            .storage
            .from("Videos")
            .upload(
              fileName,
              file,
              {
                cacheControl: "3600",
                upsert: false,
                contentType: file.type
              }
            );


        if (uploadError) {

          console.error(
            "Video upload error:",
            uploadError
          );

          throw uploadError;
        }


        // Get public URL

        const { data: publicData } =
          supabaseClient
            .storage
            .from("Videos")
            .getPublicUrl(fileName);


        const videoUrl =
          publicData.publicUrl;


        // Save post in database

        const { data: postData, error: postError } =
          await supabaseClient
            .from("posts")
            .insert({

              username: "Vibely User",

              caption:
                caption ||
                "My new Vibely video 🎬✨",

              likes: 0,

              video_url: videoUrl

            })
            .select()
            .single();


        if (postError) {

          console.error(
            "Post save error:",
            postError
          );

          throw postError;
        }


        status.textContent =
          "✅ Video successfully uploaded!";


        videoInput.value = "";

        captionInput.value = "";


        // Add new post to screen

        addVideoPostToFeed(
          postData
        );


      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ Upload failed.";

        alert(
          "Video upload nahi hua. Console error check karo."
        );

      } finally {

        uploadBtn.disabled = false;

      }

    }


    // =========================
    // ADD VIDEO POST TO FEED
    // =========================

    function addVideoPostToFeed(postData) {

      const feed =
        document.querySelector(".feed");


      const post =
        document.createElement("div");

      post.className =
        "post";

      post.dataset.postId =
        postData.id;


      post.innerHTML = `

        <div class="user">
          👤 ${escapeHtml(postData.username)}
        </div>

        <div class="video">

          <video
            controls
            playsinline
            preload="metadata"
            src="${postData.video_url}"
          ></video>

        </div>

        <div class="actions">

          <button
            class="action-btn like-btn"
            onclick="likePost(this)"
          >
            ❤️
          </button>

          <span class="like-count">
            ${postData.likes || 0} likes
          </span>

          <button
            class="action-btn"
            onclick="toggleComments(this)"
          >
            💬
          </button>

          <button
            class="action-btn"
            onclick="sharePost(this)"
          >
            ↗️
          </button>

        </div>

        <div class="caption">
          ${escapeHtml(
            postData.caption ||
            ""
          )}
        </div>

        <div class="comments">

          <div>

            <input
              type="text"
              placeholder="Write a comment..."
            >

            <button
              onclick="addComment(this)"
            >
              Post
            </button>

          </div>

          <div class="comment-list"></div>

        </div>

      `;


      feed.prepend(post);

      loadComments(postData.id);

    }


    // =========================
    // SECURITY HELPER
    // =========================

    function escapeHtml(text) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        text || "";

      return div.innerHTML;

    }


    // =========================
    // SHARE
    // =========================

    async function sharePost(button) {

      const post =
        button.closest(".post");


      const caption =
        post.querySelector(
          ".caption"
        )
          .textContent
          .trim();


      if (navigator.share) {

        try {

          await navigator.share({

            title: "Vibely",

            text: caption,

            url:
              window.location.href

          });

        } catch (error) {

          console.log(
            "Share cancelled"
          );

        }

      } else {

        alert(
          "Share option is not supported on this browser."
        );

      }

    }


    // =========================
    // LOAD COMMENTS WHEN PAGE OPENS
    // =========================

    loadComments(1);

    loadComments(2);


    // =========================
    // LOAD LIKES WHEN PAGE OPENS
    // =========================

    loadLikes();


  </script>

</body>

          </html>
