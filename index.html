  <script>
    async function likePost(button) {
  button.classList.toggle("liked");

  const post = button.closest(".post");

  if (button.classList.contains("liked")) {
    console.log("Like saved");
  } else {
    console.log("Like removed");
  }
    }
    }

    function toggleComments(button) {
      const comments = button.closest(".post").querySelector(".comments");

      comments.style.display =
        comments.style.display === "block" ? "none" : "block";
    }

    function addComment(button) {
      const box = button.closest(".comments");
      const input = box.querySelector("input");
      const list = box.querySelector(".comment-list");

      if (input.value.trim() !== "") {
        const comment = document.createElement("p");

        comment.textContent = "💬 " + input.value;
        comment.style.marginTop = "8px";

        list.appendChild(comment);
        input.value = "";
      }
    }

    function sharePost() {
      if (navigator.share) {
        navigator.share({
          title: "Vibely",
          text: "Check out this vibe on Vibely!",
          url: window.location.href
        });
      } else {
        alert("Share feature is not supported on this browser.");
      }
    }
  </script>
