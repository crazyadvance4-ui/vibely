<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibely</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: white;
      padding: 16px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
    }

    .feed {
      max-width: 500px;
      margin: auto;
      padding-bottom: 80px;
    }

    .post {
      background: white;
      margin: 15px 10px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 8px #ddd;
    }

    .user {
      padding: 14px;
      font-weight: bold;
    }

    .video {
      height: 420px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 50px;
    }

    .actions {
      padding: 14px;
      font-size: 24px;
    }

    .caption {
      padding: 0 14px 15px;
      font-size: 16px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 14px;
      font-size: 24px;
    }
  </style>
</head>

<body>

  <header>Vibely ✨</header>

  <main class="feed">

    <div class="post">
      <div class="user">👤 Vibely User</div>

      <div class="video">▶️</div>

      <div class="actions">
        ❤️ 💬 ↗️
      </div>

      <div class="caption">
        Welcome to Vibely! 🎬✨
      </div>
    </div>

    <div class="post">
      <div class="user">👤 Creator</div>

      <div class="video">🎥</div>

      <div class="actions">
        ❤️ 💬 ↗️
      </div>

      <div class="caption">
        Share your vibe with the world! 🌎
      </div>
    </div>

  </main>

  <nav>
    🏠
    🔍
    ➕
    ❤️
    👤
  </nav>

</body>
</html>
